{% include "header.html" %}
{% load i18n %}
{% load static %}

{% block content %}
    <h1>Search Results</h1>


    {% for result in results %}
        <div>
            <h2><a href="{{ result.object.get_absolute_url }}">{{ result.object.title }}</a></h2>
            <p>{{ result.object.content|truncatewords:50 }}</p>
        </div>
    {% empty %}
        <p>No results found.</p>
    {% endfor %}
{% endblock %}
